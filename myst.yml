version: 1
project:
  title: Partial Eclipses >> Total Eclipses
  authors:
    - name: Tracy Eliasson
  github: https://github.com/tkeim/eclipse-post
  license: CC-BY-4.0
  exclude:
    - README.md
    - CLAUDE.md
    - notes.md
    - footer.md
    - drafts/**
site:
  template: book-theme
  parts:
    primary_sidebar_footer: footer.md   # replaces "Made with MyST"
  options:
    hide_toc: true
    hide_outline: true             # no "Contents" box on the page
    logo: images/logo.png          # replaces the top-left "Made with MyST"
    logo_alt: I love eclipses!
    style: style.css               # Tracy Hand font (built by code/make_style.py)
